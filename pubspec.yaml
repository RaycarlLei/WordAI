name: word_a_i
description: Free and open-source offline vocabulary learning with optional self-hosted speech.
publish_to: none
version: 0.1.3+4
environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.44.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.3
  path: ^1.9.0
  sqflite: ^2.2.6
  sqflite_common_ffi: ^2.3.0
  uuid: ^4.0.0
  go_router: ^12.1.3
  shared_preferences: ^2.2.2
  path_provider: ^2.0.14
  audioplayers: ^6.8.1
  flutter_tts: ^4.2.3
  http: ^1.6.0
  file_selector: ^1.0.3
dev_dependencies:
  audioplayers_platform_interface: ^7.2.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
